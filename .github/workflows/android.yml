name: Verificar Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic
      - name: Preparar compilación
        run: |
          chmod +x gradlew
          sdkmanager 'platforms;android-37.0' 'build-tools;36.1.0'
      - name: Compilar y verificar
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: CodexPulse-prueba
          path: app/build/outputs/apk/debug/*.apk
  dispositivo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic
      - name: Preparar compilación y virtualización de pruebas
        run: |
          chmod +x gradlew
          sdkmanager 'platforms;android-37.0' 'build-tools;36.1.0'
          sudo chmod 666 /dev/kvm
          ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Probar Android 16 y renderizar los widgets
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -memory 3072
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.germanbartoli.codexpulse.test/androidx.test.runner.AndroidJUnitRunner > prueba-android.txt
            cat prueba-android.txt
            grep -q 'OK (1 test)' prueba-android.txt
            mkdir -p capturas
            adb pull /sdcard/Android/data/com.germanbartoli.codexpulse/files/. capturas/
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: CodexPulse-pruebas-Android16
          path: |
            prueba-android.txt
            capturas/
