name: Verificar Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar compilación
        run: |
          chmod +x gradlew
          sdkmanager 'platforms;android-37.0' 'build-tools;36.1.0'
      - name: Compilar y verificar
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CodexPulse-prueba
          path: app/build/outputs/apk/debug/*.apk
