name: Revisar secretos
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Revisar historial sin mostrar credenciales
        shell: pwsh
        run: ./.github/scripts/revisar-secretos.ps1
